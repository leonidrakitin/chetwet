# Docker Compose for Dockploy.
# Builds current repo code. Includes Postgres and Redis; set POSTGRES_HOST=postgres, REDIS_URL=redis://:REDIS_PASSWORD@redis:6379 in .env.

version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: chatwoot:dockploy
    env_file: .env
    volumes:
      - storage_data:/app/storage
    restart: always
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    depends_on:
      - postgres
      - redis

  rails:
    <<: *base
    # ports:
    #   - '3000:3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
