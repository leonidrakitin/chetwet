# MARK: Captain Config
- name: CAPTAIN_OPEN_AI_API_KEY
  display_title: 'OpenAI API Key'
  description: 'The API key used to authenticate requests to OpenAI services for Captain AI.'
  locked: false
  type: secret
- name: CAPTAIN_OPEN_AI_MODEL
  display_title: 'OpenAI Model'
  description: 'The OpenAI model configured for use in Captain AI. Default: gpt-4.1-mini'
  locked: false
- name: CAPTAIN_OPEN_AI_ENDPOINT
  display_title: 'OpenAI API Endpoint (optional)'
  description: >-
    Base URL for Captain chat/completions (OpenAI-compatible). For OpenRouter use https://openrouter.ai/api/v1
    (or https://openrouter.ai — /v1 is appended automatically). Embeddings use the same URL unless
    CAPTAIN_EMBEDDING_OPEN_AI_ENDPOINT is set. If OpenRouter returns "No successful provider responses" for embeddings,
    set CAPTAIN_EMBEDDING_MODEL to a model OpenRouter routes (e.g. text-embedding-ada-002) or point embeddings at direct OpenAI.
  locked: false
- name: CAPTAIN_EMBEDDING_MODEL
  display_title: 'Captain embedding model (optional)'
  description: >-
    Model id for FAQ/document vector search (RubyLLM.embed). Default: text-embedding-3-small. With OpenRouter, pick a model
    their API successfully routes (verify with a curl to /v1/embeddings). Must match vector column dimensions (pgvector 1536).
  locked: false
- name: CAPTAIN_EMBEDDING_OPEN_AI_API_KEY
  display_title: 'Captain embeddings API key (optional)'
  description: >-
    If set, embedding requests use this key instead of CAPTAIN_OPEN_AI_API_KEY. Use when chat runs on OpenRouter but
    embeddings should call OpenAI (or another provider) with a different key.
  locked: false
  type: secret
- name: CAPTAIN_EMBEDDING_OPEN_AI_ENDPOINT
  display_title: 'Captain embeddings API endpoint (optional)'
  description: >-
    If set, embedding requests use this base URL instead of CAPTAIN_OPEN_AI_ENDPOINT. Example: https://api.openai.com
    for direct OpenAI while CAPTAIN_OPEN_AI_ENDPOINT points at OpenRouter.
  locked: false
- name: CAPTAIN_OPENROUTER_HTTP_REFERER
  display_title: 'OpenRouter HTTP-Referer (optional)'
  description: 'Sent on OpenRouter requests when CAPTAIN_OPEN_AI_ENDPOINT is openrouter.ai. Defaults to BRAND_URL or a generic URL.'
  locked: false
- name: CAPTAIN_OPENROUTER_TITLE
  display_title: 'OpenRouter X-OpenRouter-Title (optional)'
  description: 'Application title header for OpenRouter. Defaults to INSTALLATION_NAME or Chatwoot.'
  locked: false
- name: CAPTAIN_DEEPSEEK_API_KEY
  display_title: 'DeepSeek API Key'
  description: 'The API key for DeepSeek services in Captain AI.'
  locked: false
  type: secret
- name: CAPTAIN_DEEPSEEK_ENDPOINT
  display_title: 'DeepSeek API Endpoint (optional)'
  description: 'The DeepSeek endpoint for Captain AI. Default: https://api.deepseek.com/'
  locked: false
- name: CAPTAIN_QWEN_API_KEY
  display_title: 'Qwen API Key'
  description: 'The API key for Qwen services in Captain AI.'
  locked: false
  type: secret
- name: CAPTAIN_QWEN_ENDPOINT
  display_title: 'Qwen API Endpoint (optional)'
  description: 'The Qwen endpoint for Captain AI. Default: https://dashscope.aliyuncs.com/compatible-mode/'
  locked: false
- name: CAPTAIN_OLLAMA_ENDPOINT
  display_title: 'Ollama API Endpoint'
  description: 'The Ollama endpoint for embedding. Example: http://localhost:11434'
  locked: false
- name: CAPTAIN_OLLAMA_API_KEY
  display_title: 'Ollama API Key (optional)'
  description: 'The API key for Ollama, if your instance requires authentication'
  locked: false
  type: secret
- name: CAPTAIN_CONTEXT_GENERATION_MODEL
  display_title: 'Context Generation Model (optional)'
  description: 'Model used to generate contextual prefixes for knowledge chunks. Default: gpt-4.1'
  locked: false
- name: CAPTAIN_DOCUMENT_CHUNKING_ENABLED
  display_title: 'Enable Document Chunking (v1)'
  description: 'Enables parallel chunk generation for Captain documents. Keep disabled until v1 rollout readiness.'
  value: false
  locked: false
  type: boolean
- name: CAPTAIN_FIRECRAWL_API_KEY
  display_title: 'FireCrawl API Key (optional)'
  description: 'The FireCrawl API key for the Captain AI service'
  locked: false
  type: secret
- name: CAPTAIN_CLOUD_PLAN_LIMITS
  display_title: 'Captain Cloud Plan Limits'
  description: 'The limits for the Captain AI service for different plans'
  value:
  type: code
# End of Captain Config

